services:
  mysql:
    image: mysql:8.0
    container_name: hotel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Hotel@2024
      MYSQL_DATABASE: HotelReservationDB
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pHotel@2024"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
